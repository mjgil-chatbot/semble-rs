[package]
name = "semble-rs"
version = "0.2.0"
edition = "2021"
description = "Strict Rust port of Semble: local hybrid code search for agents"
license = "MIT"

[lib]
name = "semble_rs"
path = "src/lib.rs"

[[bin]]
name = "semble"
path = "src/main.rs"

[dependencies]
model2vec-rs = { version = "0.1.4", default-features = true }
regex = "1.11"
tree-sitter-language-pack = { version = "1.8.1", default-features = true }

[dev-dependencies]
tempfile = "3.13"
